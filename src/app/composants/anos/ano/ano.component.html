
<!-- Affichage des données -->
<div class="midde_cont">
    <div class="container-fluid">
        <div class="row column_title">
            <div class="col-md-12">
                <div class="page_title">
                    <h2>ANOs</h2>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="white_shd full margin_bottom_30">
                    <div class="row full graph_head">
                        <div class="col-3">
                            <div class="heading1 margin_0">
                                <h2>Listes des ANOs</h2>
                            </div>
                        </div>
                        <div class="col-6">
                            <input type="text" class="form-control" placeholder="Recherche...">
                        </div>
                        <div class="col-3 text-right">
                            <button [routerLink]="['/add/ano']" class="btn btn-primary" title="Ajouter un programme">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                    <div class="table_section padding_infor_info">
                        <div class="table-responsive-sm">
                            <table class="table table-striped">
                                <thead class="thead-dark">
                                    <tr>
                                        <th>Evenement</th>
                                        <th>Responsables</th>
                                        <th>Budgets</th>
                                        <th>Statut</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let item of anos">
                                        <td>
                                            <ng-container *ngFor="let event of item.evenements; let i = index">
                                                <span>{{ event.libelle }}</span>
                                                <br>
                                            </ng-container>
                                        </td>
                                        <td>
                                            <ng-container *ngFor="let event of item.evenements; let i = index">
                                                <ng-container *ngFor="let user of event.users; let i = index">
                                                    <span>{{ user.name }} - {{ user.email }}</span>
                                                    <br>
                                                </ng-container>
                                            </ng-container>
                                        </td>
                                        <td>{{ item.budget }}</td>
                                        <td>{{ item.statut }}</td>
                                        <td>
                                            <div class="btn-group">
                                                <a class="btn btn-secondary" title="Plus de détails">
                                                    <i class="fas fa-eye"></i>
                                                </a>
                                                <a class="btn btn-primary" title="Modifier">
                                                    <i class="fas fa-edit"></i>
                                                </a>
                                                <button class="btn btn-danger" >
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <ngx-skeleton-loader count="{{ 10 }}" appearance="line" *ngIf="loader" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
