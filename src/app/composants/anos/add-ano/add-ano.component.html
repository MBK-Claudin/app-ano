<div class="midde_cont">
    <div class="container-fluid">
        <div class="row column_title">
            <div class="col-md-12">
            <div class="page_title">
                <h2>ANOs</h2>
            </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-12 mx-auto">
                <div class="white_shd full margin_bottom_30">
                    <div class="row full graph_head">
                        <div class="col-6">
                            <div class="heading1 margin_0">
                                <h2>Ajouter des ANOs</h2>
                            </div>
                        </div>
                        <div class="col-6 text-right">
                            <button (click)="goBack()" class="btn btn-link">liste des ANOs</button>
                        </div>
                    </div>
                    <div class="row full d-flex justify-content-center align-items-center">
                        <div class="col-md-12 my-3">
                            <form (ngSubmit)="insertAno()" enctype="multipart/form-data">
                                <div class="row mx-4">
                                    <div class="col-6">
                                        <!--ano -->
                                        <div class="form-group">
                                            <label for="activite">Activité du PTBA :</label>
                                            <select name="text" id="activite" name="activite" class="form-control" required [(ngModel)]="activite_id">
                                                <option [value]="a.id" *ngFor="let a of activites" class="text-truncate">{{ a.libelle | slice:0:50 }}...</option>
                                            </select>
                                        </div>
                                        <hr>
                                        <div class="form-group">
                                            <label for="budget">Budget :</label>
                                            <input type="number" min="100000" step="10000" [(ngModel)]="budget" class="form-control" id="budget" name="budget" required>
                                        </div>
                                        <hr>
                                        <div class="row">
                                            <div class="col-6">
                                                <div class="heading1 margin_0">
                                                    <div class="row">
                                                        <div class="col-6">
                                                            <h5>Documents</h5>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label for="titre">Titre</label>
                                            <input type="text" class="form-control" [(ngModel)]="titre" id="titre" name="titre" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="documents">Document</label>
                                            <input #doc type="file" class="form-control" id="documents[]" name="documents[]" (change)="onFileChange($event)" accept="application/pdf">
                                        </div>
                                        <ul>
                                            <li *ngFor="let file of files; let i = index">
                                                <div class="row">
                                                    <div class="col-9">{{ file.name }} - {{ titres[i] }} </div>
                                                    <div class="col-3"><button class="btn btn-danger" (click)="removeFile(i)"><i class="fas fa-trash"></i></button></div>
                                                </div>
                                                
                                            </li>
                                        </ul>
                                    </div>
                                    <div class="col-6">
                                        <!-- event -->
                                        <div class="row">
                                            <div class="col-6">
                                                <div class="heading1 margin_0">
                                                    <div class="row">
                                                        <div class="col-6">
                                                            <h5>Evènements({{anoList.length}}) </h5>
                                                        </div>
                                                        <div class="col-6 text-right">
                                                            <button type="button" class="btn btn-primary" (click)="addEvent()"><i class="fas fa-plus"></i></button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label for="evenement">Libellé de l'évènement :</label>
                                            <input type="text" class="form-control" [(ngModel)]="event" id="evenement" name="evenement" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="date_debut">Date de debut :</label>
                                            <input type="date" [(ngModel)]="date_debut" class="form-control" id="date_debut" name="date_debut" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="date_fin">Date de fin :</label>
                                            <input type="date" [(ngModel)]="date_fin" class="form-control" id="date_fin" name="date_fin" required>
                                        </div>
                                        <hr>
                                        <!-- Responsable event -->
                                        <div class="row">
                                            <div class="col-6">
                                                <div class="heading1 margin_0">
                                                    <h5>Responsables</h5>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label for="name">Nom & prénom</label>
                                            <select type="text" [(ngModel)]="responsable" class="form-control" id="name" name="name[]" (change)="onUserSelect($event)" required>
                                                <option *ngFor="let user of users" [value]="user.name">{{user.name}}</option>
                                            </select>
                                        </div>
                                        <div class="form-group">
                                            <label for="email">Email</label>
                                            <input type="email" [(ngModel)]="email" class="form-control" id="email" name="email" readOnly>
                                        </div>
                                    </div>
                                </div>
                                <!-- Fin du formulaire -->
                                <div class="modal-footer">
                                    <button type="submit" class="btn btn-primary">enregistrer l'ano</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
