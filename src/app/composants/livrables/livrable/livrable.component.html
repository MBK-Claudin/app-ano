<div class="row">
  <div class="col-md-12">
      <div class="white_shd full margin_bottom_30">
          <div class="row full graph_head">
              <div class="col-3">
                  <div class="heading1 margin_0">
                      <h2>Liste des Livrables</h2>
                  </div>
              </div>
              <div class="col-6">
                  <input type="text" class="form-control" placeholder="Recherche...">
              </div>
              <div class="col-3 text-right">
                  <button (click)="openmodal()" class="btn btn-primary" title="Ajouter un programme" >
                      <i class="fas fa-plus"></i>
                  </button>
              </div>
          </div>
          <div class="table_section padding_infor_info">
              <div class="table-responsive-sm">
                  <table class="table table-striped">
                      <thead class="thead-dark">
                          <tr>
                              <th>Activité</th>
                              <th>Phase</th>
                              <th>Livrable</th>
                              <th>Responsables</th>
                              <th>Actions</th>
                          </tr>
                      </thead>
                      <tbody>
                        <!-- Boucle pour parcourir la liste des livrables -->
                        <tr *ngFor="let livrable of livrables">
                          <!-- Colonne Activité -->
                          <td>{{ livrable.activite }}</td>

                          <!-- Colonne Livrable -->
                          <td>{{ livrable.livrable }}</td>

                          <!-- Colonne Documents -->
                          <td>
                            <ng-container *ngFor="let doc of livrable.documents">
                              <a [href]="doc" target="_blank">{{ extractFileName(doc) }}</a>
                              <br>
                            </ng-container>
                          </td>

                          <!-- Colonne Responsable -->
                          <td>{{ livrable.responsable }}</td>

                          <!-- Colonne Actions -->
                          <td>
                            <div class="btn-group">
                              <button class="btn btn-secondary" title="Plus de détails">
                                <i class="fas fa-eye"></i>
                              </button>
                              <button class="btn btn-primary" title="Modifier">
                                <i class="fas fa-edit"></i>
                              </button>
                              <button class="btn btn-danger" title="Supprimer">
                                <i class="fas fa-trash"></i>
                              </button>
                            </div>
                          </td>
                        </tr>
                      </tbody>

                  </table>
              </div>
          </div>
      </div>
  </div>
</div>

<div class="modal" tabindex="-1" role="dialog"  id="modal">
  <div class="modal-dialog modal-xl" role="document">
      <div class="modal-content">
          <div class="modal-header">
              <h5 class="modal-title">Nouveau Livrable </h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                  <span (click)="closemodal()" aria-hidden="true">&times;</span>
              </button>
          </div>
          <div class="modal-body">
              <!-- Formulaire d'ajout -->
              <form (ngSubmit)="insertLivrable()">
                  <div class="row">
                      <div class="col-6">
                          <!--livrables -->
                          <div class="form-group">
                              <label for="activite">Activite :</label>
                              <select type="text" [(ngModel)]="activite_id" class="form-control" id="activite_id" name="activite_id" required>
                                  <option [value]="j.id" *ngFor="let j of jalons">{{ j.libelle }}</option>
                              </select>
                          </div>
                          <hr>
                          <div class="form-group">
                              <label for="livrable">Livrable :</label>
                              <input type="text" [(ngModel)]="livrable" class="form-control" id="livrable" name="livrable" required>
                          </div>
                          <hr>
                          <!-- responsables -->
                          <div class="row">
                              <div class="col-6">
                                  <div class="heading1 margin_0">
                                      <h5>Responsables</h5>
                                  </div>
                              </div>

                          </div>
                          <div class="form-group">
                              <label for="name">Nom & prénom</label>
                              <select type="text" [(ngModel)]="responsable" class="form-control" id="name" name="name" required>
                                  <option *ngFor="let user of users" [value]="user.id">{{user.name}}</option>
                              </select>
                          </div>

                      </div>
                      <div class="col-6">
                          <div class="row">+
                              <div class="col-6">
                                  <div class="heading1 margin_0">
                                      <div class="row">
                                          <div class="col-6">
                                              <h5>Documents</h5>
                                          </div>
                                      </div>
                                  </div>
                              </div>
                          </div>
                          <div class="form-group">
                              <label for="titre">Titre</label>
                              <input type="text" class="form-control" [(ngModel)]="titre" id="titre" name="titre" required>
                          </div>
                          <div class="form-group">
                              <label for="documents">Document</label>
                              <input #doc type="file" class="form-control" id="documents" name="documents" (change)="onFileChange($event)" accept=".pdf">
                          </div>
                          <ul>
                              <li *ngFor="let file of files; let i = index">
                                  <div class="row">
                                      <div class="col-9">{{ file.name }} - {{ titres[i] }} </div>
                                      <div class="col-3"><button class="btn btn-danger" (click)="removeFile(i)"><i class="fas fa-trash"></i></button></div>
                                  </div>

                              </li>
                          </ul>
                      </div>
                  </div>
                  <!-- Fin du formulaire -->
                  <div class="modal-footer">
                      <button type="submit" class="btn btn-primary">enregistrer l'ano</button>
                  </div>
              </form>
          </div>
      </div>
  </div>
</div>
