                                                <table class="table table-inbox table-hover">
                                                    <ng-container *ngFor="let tache of taches">
                                                        <!-- Événements -->
                                                        <tbody>
                                                            <tr *ngFor="let ano of anos">
                                                                <td class="inbox-small-cells">
                                                                    <div class="custom-control custom-checkbox">
                                                                        <input type="checkbox" class="custom-control-input">
                                                                        <label class="custom-control-label" for="customCheck{{ano.id}}"></label>
                                                                    </div>
                                                                </td>
                                                                <td class="view-message dont-show">Traitement de demande d'ANO <span class="badge badge-warning pull-right" style="width: 100px; display: inline-block; text-align: center;">À traiter</span></td>
                                                                <td class="view-message">{{ano.libelle}}</td>
                                                                <td class="view-message inbox-small-cells"><i class="fa fa-paperclip"></i></td>
                                                                <td class="view-message text-right">{{ano.budget}}</td>
                                                            </tr>
                                                        </tbody>
                                                
                                                        <!-- Jalons -->
                                                        <tbody>
                                                            <tr *ngFor="let activite of activites">
                                                                <td class="inbox-small-cells">
                                                                    <div class="custom-control custom-checkbox">
                                                                        <input type="checkbox" class="custom-control-input" id="customCheck{{activite.id}}">
                                                                        <label class="custom-control-label" for="customCheck{{activite.id}}"></label>
                                                                    </div>
                                                                </td>
                                                                <td class="view-message dont-show">Jalon <span class="badge badge-info pull-right" style="width: 100px; display: inline-block; text-align: center;">En cours</span></td>
                                                                <td class="view-message">{{activite.libelle}}</td>
                                                                <td class="view-message inbox-small-cells"><i class="fa fa-paperclip"></i></td>
                                                                <td class="view-message text-right">{{activite.date_debut}} - {{activite.date_fin}}</td>
                                                            </tr>
                                                        </tbody>
                                                
                                                        <!-- Livrables -->
                                                        <tbody *ngIf="tache.livrable && tache.livrable.length > 0">
                                                            <tr *ngFor="let deliverable of tache.livrable">
                                                                <td class="inbox-small-cells">
                                                                    <div class="custom-control custom-checkbox">
                                                                        <input type="checkbox" class="custom-control-input" id="customCheck{{deliverable.id}}">
                                                                        <label class="custom-control-label" for="customCheck{{deliverable.id}}"></label>
                                                                    </div>
                                                                </td>
                                                                <td class="view-message dont-show">Livrable <span class="badge badge-success pull-right" style="width: 100px; display: inline-block; text-align: center;">À traiter</span></td>
                                                                <td class="view-message">{{deliverable.libelle}}</td>
                                                                <td class="view-message inbox-small-cells"><i class="fa fa-paperclip"></i></td>
                                                                <td class="view-message text-right">{{deliverable.date_debut}} - {{deliverable.date_fin}}</td>
                                                            </tr>
                                                        </tbody>
                                                    </ng-container>
                                                </table>                                                
                                
                                                <div class="alert alert-primary" role="alert" *ngIf="taches.length === 0">
                                                    Aucune Tâches !!
                                                </div> 
                                            </div>
                                        </aside>
                                    </div>
                                </div>
                            </div>
                        </div>
