
<!-- Affichage des données -->
<div class="row">
    <div class="col-md-12">
        <div class="white_shd full margin_bottom_30">
            <div class="row full graph_head">
                <div class="col-3">
                    <div class="heading1 margin_0">
                        <h2>Liste des sites de déploiements</h2>
                    </div>
                </div>
                <div class="col-9">
                    <input type="text" class="form-control" placeholder="Recherche..." (keyup)="filterSite()" [(ngModel)]="searchText">
                </div>
            </div>
            <div class="table_section padding_infor_info">
                <div class="table-responsive-sm">
                    <table class="table table-striped">
                        <thead class="thead-dark">
                            <tr>
                                <th>Activité(Jalon)</th>
                                <th>Site</th>
                                <th>Province</th>
                                <th>Département</th>
                                <th>Ville</th>
                                <th>Coordonnées GPS</th>
                                <th>Commentaires</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let a of sites">
                                <td>{{ a.libelle }}</td>
                                <ng-container *ngFor="let site of a.sites">
                                    <td>{{ site.libelle }}</td>
                                    <td>{{ site.province }}</td>
                                    <td>{{ site.departement }}</td>
                                    <td>{{ site.ville }}</td>
                                    <td>{{ site.coordonnees_gps }}</td>
                                    <td>{{ site.commentaire }}</td>
                                </ng-container>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
