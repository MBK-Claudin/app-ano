<div class="full_container">
    <div class="container">
        <div class="center verticle_center full_height">
            <div class="login_section">
                <div class="logo_login">
                    <div class="center">
                        <img width="210" src="assets/images/logo/eano_logo.png" alt="#" />
                    </div>
                </div>
                <div class="login_form">
                    <div class="text-center mb-4 my-auto">
                        <h2 class="fw-bold mb-3">Connexion</h2>
                        <p class="h5 text-secondary">Bienvenue sur E-ANO</p>
                        <p class="text-muted mb-4">Connectez-vous avec votre compte Microsoft</p>

                        <div class="d-grid gap-3 mx-auto">
                            <!-- Microsoft 365 Button -->
                            <button (click)="login()" class="btn btn-lg btn-secondary d-flex align-items-center justify-content-center" >
                                <!-- Microsoft Logo Coloré -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16" class="mr-3">
                                    <rect width="7" height="7" fill="#f25022"></rect>
                                    <rect x="9" width="7" height="7" fill="#7fba00"></rect>
                                    <rect y="9" width="7" height="7" fill="#00a4ef"></rect>
                                    <rect x="9" y="9" width="7" height="7" fill="#ffb900"></rect>
                                </svg>
                                Connexion avec Microsoft
                            </button>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
