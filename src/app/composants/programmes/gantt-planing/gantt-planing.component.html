<div class="row justify-content-center my-3">
    <div class="col-md-6">
        <button (click)="switchBoll()" class="btn btn-link">Vue gantt</button>
    </div>
    <div class="col-md-6">
        <button (click)="switchBoll()" class="btn btn-link">Vue Tableau</button>
    </div>
</div>
<!-- planing gantt -->
<div class="midde_cont" *ngIf="bool && Data.length > 0">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <div class="white_shd full margin_bottom_30">
                    <div class="row full graph_head">
                        <div class="heading1 margin_0">
                            <h2>Planing Gantt</h2>
                        </div>
                    </div>
                    
                    <ejs-gantt height="550px" [dataSource]="Data" [taskFields]="taskSettings"></ejs-gantt>
                    
                </div>
            </div>
        </div>
    </div>
</div>

<!-- planing tableau -->
<div class="midde_cont" *ngIf="!bool && DataTable.length > 0">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <div class="white_shd full margin_bottom_30">
                    <div class="row full graph_head">
                        <div class="heading1 margin_0">
                            <h2>Planing Tableau</h2>
                        </div>
                    </div>
                    <div class="table_section padding_infor_info">
                        <div class="table-responsive-sm">
                            <table class="table table-striped">
                                <thead class="thead-dark">
                                    <tr>
                                        <th>Phase</th>
                                        <th>Activité</th>
                                        <th>Progréssion</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Parcours des phases -->

                                    <ng-container *ngFor="let phase of DataTable">

                                        <td>{{ activity.libelle }}</td>
                                        <td>
                                            <div class="progress">
                                            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 25%;" 
                                                attr.aria-valuenow="{{ activity.progress }}" aria-valuemin="0" aria-valuemax="100">
                                                {{ activity.progress }} %
                                            </div>
                                            </div>
                                        </td>
                                        </tr>
                                    </ng-container>
                                    -->
                                    
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
