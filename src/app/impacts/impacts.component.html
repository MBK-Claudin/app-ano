
<!-- Affichage des données -->
<div class="row">
  <div class="col-md-12">
      <div class="white_shd full margin_bottom_30">
          <div class="row full graph_head">
              <div class="col-3">
                  <div class="heading1 margin_0">
                      <h2>Listes d'impacts</h2>
                  </div>
              </div>
              <div class="col-6">
                  <input type="text" class="form-control" placeholder="Recherche...">
              </div>
              <div class="col-3 text-right">
                  <button  class="btn btn-primary" title="Ajouter un Impact">
                      <i id="modale" class="fas fa-plus"></i>
                  </button>
              </div>
          </div>
          <div class="table_section padding_infor_info">
              <div class="table-responsive-sm">
                  <table class="table table-striped">
                      <thead class="thead-dark">
                          <tr>
                            <th>Type impact</th>
                            <th>Libelle</th>
                            <th>Activité PTBA</th>
                            <th>Force</th>
                            <th>Site</th>
                            <th>Taille</th>
                            <th>Mitigation</th>
                            <th>Actions</th>
                          </tr>
                      </thead>
                      <tbody>
                        <tr *ngFor="let impact of impacts">
                          <td>{{ impact.type_impact }}</td>
                          <td>{{ impact.libelle_impact }}</td>
                          <td>{{ impact.force }}</td>
                          <td>{{ impact.site_id }}</td>
                          <td>{{ impact.taille }}</td>
                          <td>{{ impact.mitigation }}</td>
                          <td>{{ impact.activite_budget_annuel_id }}</td>
                          <td>
                            <div class="btn-group">
                              <button class="btn btn-secondary" title="Plus de détails">
                                <i class="fas fa-eye"></i>
                              </button>
                              <button class="btn btn-primary" title="Modifier">
                                <i class="fas fa-edit"></i>
                              </button>
                              <button class="btn btn-danger">
                                <i class="fas fa-trash"></i>
                              </button>
                            </div>
                          </td>
                        </tr>


                      </tbody>

                  </table>
              </div>
          </div>
      </div>
  </div>
</div>
